name: Auto Update Cars from Telegram

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '8.0.x'

      - name: Run Scraper
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TG_API_ID: ${{ secrets.TG_API_ID }}
          TG_API_HASH: ${{ secrets.TG_API_HASH }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHANNEL_ID: ${{ secrets.TG_CHANNEL_ID }}
        run: dotnet run --project NJMScraper

      - name: Clean temporary build and session files
        run: |
          rm -f scraper.session NJMScraper/scraper.session
          rm -rf NJMScraper/bin NJMScraper/obj

      - name: Commit and Push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git rm -rf --ignore-unmatch scraper.session NJMScraper/scraper.session NJMScraper/bin NJMScraper/obj
          git add *.json images_*/* .github/workflows/scraper.yml NJMScraper/Program.cs NJMScraper/NJMScraper.csproj
          if ! git diff --staged --quiet; then
            git commit -m "Auto-update cars and upload to GitHub Releases"
            git push
          fi
